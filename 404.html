<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARPL EHS Permit-to-Work — Page Not Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #0A1628;
            --orange: #E65100;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --border: #E2E8F0;
            --text: #1E293B;
            --text-muted: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            max-width: 520px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
        }
        .icon {
            width: 64px;
            height: 64px;
            background: #FFF7ED;
            color: var(--orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }
        h1 {
            font-size: 22px;
            color: var(--navy);
            margin-bottom: 8px;
            font-weight: 700;
        }
        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--orange);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.15s ease;
        }
        .btn:hover {
            background: #C2410C;
        }
    </style>
    <script>
        // Automatic SPA route preservation and redirect for GitHub Pages
        (function() {
            var currentPath = window.location.pathname;
            var pathSegments = currentPath.split('/').filter(Boolean);
            // If hosted at /repo-name/some-route, redirect to /repo-name/
            var target = './';
            setTimeout(function() {
                window.location.replace(target);
            }, 1200);
        })();
    </script>
</head>
<body>
    <div class="box">
        <div class="icon"><i class="fa-solid fa-compass"></i></div>
        <h1>Redirecting to ARPL EHS</h1>
        <p>The requested route is being redirected to the main Permit-to-Work digital safety portal.</p>
        <a href="./" class="btn"><i class="fa-solid fa-arrow-left"></i> Return to Safety Portal</a>
    </div>
</body>
</html>
